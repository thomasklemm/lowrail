[package]
name = "lowrail"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Guarded, boot-fact specialization of Rails apps delivered as ISeqs"
publish = false

[dependencies]
libc = "0.2"
ruby-prism = "=2.0.0"
# Upstream v0.4.2 includes #1077; its Prism rc2 range accepts stable 2.0.
rubydex = { git = "https://github.com/Shopify/rubydex", rev = "c69a742c9097a2a5c13f97726abda55b0507121b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
