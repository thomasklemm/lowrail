# Known findings for the readiness runner (docs/upstream/readiness.md). A flag matches the first entry whose
# `suite` (anchored regex over manifest suite names), `signature` (regex over the normalized signature) and
# optional `test` and `class` match. Status as of 2026-11-04, from docs/upstream/contributions.md:
#   open-pr, merged, prepared (fix branch ready, not opened), issue (reported, no fix), record-only,
#   gem-side (the fix belongs in the gem or app), noise (environmental or order-dependent on both trees).
# Entries marked "unchecked" take their regex from the record's wording; no run has produced the signature yet.
# Narrow them after the first run that does. IDs with a dash and a name (M-vary, eco1-…) are unnamed in the record.
