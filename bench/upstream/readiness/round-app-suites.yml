# The app-suite round (docs/upstream/app-suites.md), as a readiness manifest. Pins, bumps, shims and setup are
# taken from the round's threads; only lobsters was rerun through the runner (smoke test, docs/upstream/readiness.md).
# The other suites are unchecked: their first run may need a setup fix, which shows as suite-did-not-load.
# Services, started by hand: PostgreSQL on 5432 (user postgres, no password) for Mastodon and Sure, Redis on 6379,
# Chrome for writebook-system. Main-only workarounds from the record are separate `-shimmed` suites, so the plain
# suite still shows the finding they hide.
ruby: 4.0.9
rails:
  base: 6e09124217      # 8-1-stable, v8.1.4.1
  candidate: 8b06b0eb98 # main, as in the record
seeds: [4242, 1717]
alone_runs: 5
timeout: 5400

suites:
  redmine: &redmine
    repo: https://github.com/redmine/redmine
    ref: 41cd39c24a9f913a69c8a9ec4cbc128a6600fbce
    framework: minitest
    env: { RAILS_ENV: test, BUNDLE_WITHOUT: development }
    shims:
      - "printf 'test:\\n  adapter: sqlite3\\n  database: db/redmine_test.sqlite3\\ndevelopment:\\n  adapter: sqlite3\\n  database: db/redmine_dev.sqlite3\\n' > config/database.yml"
    setup: ["bin/rails db:drop db:create db:migrate"]
    test: bin/rails test
  # S1 stops main from booting; the record ran the rest of the suite with this candidate-only workaround.
  redmine-shimmed:
    <<: *redmine
    shims:
      - "printf 'test:\\n  adapter: sqlite3\\n  database: db/redmine_test.sqlite3\\ndevelopment:\\n  adapter: sqlite3\\n  database: db/redmine_dev.sqlite3\\n' > config/database.yml"
      - { tree: cand, run: "sed -i 's/insert_before Rack::Sendfile, Rack::ContentLength/insert_before ActionDispatch::Static, Rack::ContentLength/' config/application.rb" }

  lobsters: &lobsters
    repo: https://github.com/lobsters/lobsters
    ref: b6ea255ad79e86a85b9c587d461d81545ca8f0a4
    framework: rspec
    env: { RAILS_ENV: test }
    shims: ["cp .github/workflows/check/* config/ && cp config/database.yml.sample config/database.yml"]
    setup: ["bin/rails db:schema:load db:migrate"]
    test: rspec
  # L1 keeps every feature spec from loading with rspec-rails 8.0.x; the record pinned rspec-rails' fix.
  lobsters-rspec-rails-main:
    <<: *lobsters
    bumps: { rspec-rails: { git: https://github.com/rspec/rspec-rails, ref: 9fb6f4f0a3 } }

  solidus-core: &solidus
    repo: https://github.com/solidusio/solidus
    ref: ed00fc8
    framework: rspec
    env: { DB: sqlite, BUNDLE_WITHOUT: "lint:release" }
    shims: ["sed -i 's/\"< 8.2\"/\"< 8.3\"/' core/solidus_core.gemspec"]
    test: cd core && rspec
  solidus-api:
    <<: *solidus
    test: cd api && rspec

  # The record used flatware with 6 workers; rspec_json.rb keeps every worker's results. Each run loads its own
  # schema, because both trees share the database names.
  mastodon: &mastodon
    repo: https://github.com/mastodon/mastodon
    ref: a255155
    framework: rspec
    env: { RAILS_ENV: test, DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_USER: postgres, DB_PASS: "", ALLOW_NOPAM: "true",
           BUNDLE_WITH: test, BUNDLE_WITHOUT: "development:pam_authentication" }
    bumps: { rspec-rails: { git: https://github.com/rspec/rspec-rails, ref: 9fb6f4f0a3 } }
    shims: ["corepack yarn install --immutable"]
    setup: ["bin/rails assets:precompile"]
    test: bin/rails db:drop db:create db:schema:load && flatware fan -w 6 bin/rails db:test:prepare && flatware rspec -w 6
  # R1 and M1 cover about 2400 of the main failures; the record compared the rest with these app shims on main.
  mastodon-shimmed:
    <<: *mastodon
    shims:
      - "corepack yarn install --immutable"
      - { tree: cand, patch: round-app-suites/mastodon-main-shims.patch }

  sure:
    repo: https://github.com/we-promise/sure
    ref: e658686d5ba7a55734ae9f42683618aa42342b74
    ruby: 3.4.9
    framework: minitest
    env: { RAILS_ENV: test, PARALLEL_WORKERS: 2, PLAID_CLIENT_ID: foo, PLAID_SECRET: bar,
           DATABASE_URL: "postgres://postgres@127.0.0.1:5432", REDIS_URL: "redis://127.0.0.1:6379" }
    bumps: { lookbook: "2.3.15" } # Rails main needs marcel ~> 2.0; lookbook < 2.3.15 pins marcel ~> 1.0
    test: bin/rails db:drop db:create db:schema:load && bin/rails test

  # Writebook tracks main: its base is its own locked Rails, not 8-1-stable.
  writebook: &writebook
    repo: https://github.com/basecamp/writebook
    ref: d57c62bc19edac3930d3860a2584757f1d45d07c
    ruby: 3.4.12
    rails: { base: 3a4961048ad251b50991ae83135d760a8a9e8ae3, candidate: 7a78da5a5576d7ab7549b10fb13156788478ba35 }
    framework: minitest
    env: { RAILS_ENV: test }
    bumps: { globalid: "1.4.0" } # main's activejob needs globalid >= 1.4.0; it fits the locked Rails too
    setup: ["bin/rails db:prepare"]
    test: bin/rails test
  writebook-system:
    <<: *writebook
    test: bin/rails test:system
