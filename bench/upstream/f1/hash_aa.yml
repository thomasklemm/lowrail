prelude: |
  h = {a:1, b:2, c:3, d:4, e:5, f:6, g:7, h:8}
  e = {}
  h3 = {a: 1, b: 2, c: 3}
  s3 = {"a" => 1, "b" => 2, "c" => 3}
  sk = +"b"
  ident = {a: 1, b: 2, c: 3}.compare_by_identity
  big = (0...1000).to_h { [:"k#{_1}", _1] }
  v = 2
benchmark:
  miss_empty: e[:a]; e[:a]; e[:a]; e[:a]; e[:a]; e[:a]; e[:a]; e[:a]; e[:a]; e[:a]
  hit_first: h[:a]; h[:a]; h[:a]; h[:a]; h[:a]; h[:a]; h[:a]; h[:a]; h[:a]; h[:a]
  hit_third: h[:c]; h[:c]; h[:c]; h[:c]; h[:c]; h[:c]; h[:c]; h[:c]; h[:c]; h[:c]
  hit_fourth: h[:d]; h[:d]; h[:d]; h[:d]; h[:d]; h[:d]; h[:d]; h[:d]; h[:d]; h[:d]
  hit_last: h[:h]; h[:h]; h[:h]; h[:h]; h[:h]; h[:h]; h[:h]; h[:h]; h[:h]; h[:h]
  miss: h[:_]; h[:_]; h[:_]; h[:_]; h[:_]; h[:_]; h[:_]; h[:_]; h[:_]; h[:_]
  h3_aref_b: h3[:b]
  h3_aref_str_equal: s3[sk]
  ident3_aref_c: ident[:c]
  big_aref: big[:k500]
  literal3: "x = {a: v, b: v, c: v}"
  literal8: "x = {a: v, b: v, c: v, d: v, e: v, f: v, g: v, h: v}"
  literal9: "x = {a: v, b: v, c: v, d: v, e: v, f: v, g: v, h: v, i: v}"
