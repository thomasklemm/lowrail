name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Every push to main gets its own run (a shared group would drop queued runs); a pull request keeps only its newest.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Lowrail::RailsPins releases; each job's gem home holds only that Rails.
        rails: ["8.1.4", "8.1.4.1"]
    name: test (Rails ${{ matrix.rails }})
    env:
      GEM_HOME: /home/runner/gems
      LOWRAIL_RAILS: ${{ matrix.rails }}
      # A missing prerequisite fails instead of skipping; tests that need what CI lacks are excluded by name below.
      LOWRAIL_STRICT_GATES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7" # mise.toml
          bundler: none
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: /home/runner/gems
          key: gems-${{ runner.os }}-ruby-4.0.7-rails-${{ matrix.rails }}-${{ hashFiles('script/gate-gems') }}
      - name: Gems (script/gate-gems, the gate's gem set)
        run: |
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          ruby script/gate-gems
      - name: Rust tests
        if: matrix.rails == '8.1.4'
        run: cargo test --locked
      - name: Gem tests
        working-directory: gem
        run: |
          excluded=(
            # Need corpus apps from script/corpus (.corpus/real-blog, real-blog-r4, campfire: network, bundles, assets).
            'BlogProductionTest#test_cold_sealed_admission_does_not_prepare_the_app'
            'BlogProductionTest#test_terminal_completion_distinguishes_pending_jobs_from_drained_cable'
            'E2ETest#test_real_blog_outcomes_identical_with_hooks'
            'FactsRealBlogTest#.*'
            'FormScaffoldTest#test_passive_production_token_and_collection_public_artifact'
            'FormScaffoldTest#test_public_sealed_build_preserves_forms_observers_and_refuses_custom_builder'
            'MaterializeCorpusTest#.*'
            'ObserveCorpusTest#.*'
            'TestCertificateTest#test_render_.*'
            # Need the Rails v8.1.4 checkout and its bundle from script/rails-suite --prepare.
            'RailsSuiteReportTest#test_separate_build_does_not_change_view_primary_key_results'
            'RailsSuiteReportTest#test_profiling_preserves_backtrace_cleaner_results'
          )
          pattern="/^($(IFS='|'; echo "${excluded[*]}"))\$/"
          ruby -S rake test TESTOPTS="--verbose --seed=1729 --exclude='$pattern'"

  # lowrail-profile's support matrix: its tests with Rails installed, so none of them skip, and the built gem.
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.ruby == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ruby: ["3.3", "3.4", "4.0"]
        rails: ["7.2.4", "8.0.5.2", "8.1.4"]
        include:
          - { os: macos-latest, ruby: "3.3", rails: "7.2.4" }
          - { os: macos-latest, ruby: "4.0", rails: "8.1.4" }
          # NEWOBJ is an internal event: a future Ruby may change when it fires.
          - { os: ubuntu-24.04, ruby: head, rails: "8.1.4" }
    name: profile (${{ matrix.os }}, Ruby ${{ matrix.ruby }}, Rails ${{ matrix.rails }})
    env:
      LOWRAIL_RAILS: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: none
      - name: Gems
        run: gem install --no-document rails -v "$LOWRAIL_RAILS" && gem install --no-document sqlite3 bcrypt minitest:5.27.0 rspec-core
      - name: Profile tests
        working-directory: gem
        run: |
          ruby -Ilib -Itest -e 'ARGV.select { _1.end_with?(".rb") }.each { require File.expand_path("test/#{_1}") }; ARGV.reject! { _1.end_with?(".rb") }' -- \
            profile_test.rb profile_compare_test.rb profile_package_test.rb workloads_test.rb load_hooks_test.rb --verbose --seed=1729 | tee ../profile-tests.log
          grep -Eq '^[0-9]+ runs, [0-9]+ assertions, 0 failures, 0 errors, 0 skips$' ../profile-tests.log
